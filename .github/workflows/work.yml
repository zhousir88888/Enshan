name: 'run'

on:
  schedule:
    - cron: '30 */8 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'setup python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: requirements
        run: pip install -r requirements.txt

      - name: main
        env:
          cookie_enshan: ${{ secrets.cookie_enshan }}
        run: python Enshan.py
